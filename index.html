<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signup Page</title>
  </head>
  <body>
    <header class="leftSide">
      <div class="odinTitle">
        <h1>Odin</h1>
      </div>
      <div class="credit">
        Photo by Halle West on Unsplash
      </div>
    </header>
    <div>
      <p>
        This is not a real online service! You know you something like this in
        your life to help you realize your deepest dreams. Sign up
        <em>now</em> to get started.
      </p>
      <p>You <em>know</em> you want to.</p>
      <p>Let's do this!</p>
    </div>
    <form action="">
      <div class="fName">
        <label for="fName">First Name</label>
        <input type="text" id="fName" name="fName" />
      </div>
      <div class="lName">
        <label for="lName">Last Name</label>
        <input type="text" id="lName" name="lName" />
      </div>
      <div class="email">
        <label for="email">Email</label>
        <input type="text" id="email" name="email" />
      </div>
      <div class="phoneNumber">
        <label for="phoneNumber">Phone Number</label>
        <input type="tel" id="phoneNumber" name="phoneNumber" />
      </div>
      <div class="firstPassword">
        <label for="firstPassword">Password</label>
        <input type="password" id="firstPassword" name="firstPassword" />
      </div>
      <div class="confirmPassword">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" item="confirmPassword" name="confirmPassword" />
      </div>
      <div class="submit">
        <button type="submit" class="createAccount">Create Account</button>
      </div>
    </form>

    <div>
      <p>Already have an account? <a href="code/login.html">Log in</a></p>
    </div>

    <script></script>
  </body>
</html>
