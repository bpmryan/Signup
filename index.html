<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Norse&display=swap">
    <link rel="stylesheet" href="../code/style.css" />
    <title>Signup Page</title>
  </head>
  <body>
    <header id="leftSide">
      <div id="odinTitle">
        <img src="media/odin.png" alt="Odin icon" />
        <h1>Odin</h1>
      </div>
      <div id="credit">
        Photo by
        <a
          href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA"
          target="_blank"
          >Halle West</a
        >
        on Unsplash
      </div>
    </header>
    <div class="rightSide">
      <p>
        This is not a real online service! You know you something like this in
        your life to help you realize your deepest dreams. Sign up
        <em>now</em> to get started.
      </p>
      <p>You <em>know</em> you want to.</p>

      <form action="">

        <h2>Let's do this!</h2>

        <div class="fName">
          <label for="fName">First Name</label>
          <input type="text" id="fName" name="fName" placeholder="John" />
        </div>

        <div class="lName">
          <label for="lName">Last Name</label>
          <input type="text" id="lName" name="lName" placeholder="Doe" />
        </div>

        <div class="email">
          <label for="email">Email</label>
          <input
            type="text"
            id="email"
            name="email"
            placeholder="johndoe@example.com"
          />
        </div>

        <div class="phoneNumber">
          <label for="phoneNumber">Phone Number</label>
          <input type="tel" id="phoneNumber" name="phoneNumber" />
        </div>

        <div class="firstPassword">
          <label for="firstPassword">Password</label>
          <input type="password" id="firstPassword" name="firstPassword" />
        </div>

        <div class="confirmPassword">
          <label for="confirmPassword">Confirm Password</label>
          <input
            type="password"
            item="confirmPassword"
            name="confirmPassword"
          />
        </div>

        <div class="submit">
          <button type="submit" class="createAccount">Create Account</button>
        </div>

      </form>

      <div id="goToLog">
        <p>Already have an account? <a href="code/login.html">Log in</a></p>
      </div>

    </div>

    <script src="code/script.js"></script>
  </body>
</html>
